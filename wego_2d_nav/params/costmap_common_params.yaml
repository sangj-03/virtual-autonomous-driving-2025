footprint: [[-0.1, -0.1], [-0.1, 0.1], [0.3, 0.1], [0.3, -0.1]]
footprint_padding: 0.02

# inflation_radius: 0.45

transform_tolerance: 0.2
map_type: costmap

inflation_layer:
  enabled: true
  cost_scaling_factor: 10.0
  # inflation_radius: 0.4
  inflation_unknow: true
static_layer:
  enabled: true
  map_topic: "/map" 
obstacle_layer:
  enabled: true
  obstacle_range: 5.0
  raytrace_range: 6.0
  observation_sources: scan obstacles
  scan:
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
  obstacles:
    data_type: ObstacleArrayMsg
    topic: /move_base/TebLocalPlannerROS/obstacles
    marking: true
    clearing: true
